<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo Exercise</title>
  </head>
  <body>
    <!-- ToDo Form -->
    <form id="toDoForm">
      <input type="text" id="toDoInput" placeholder="What's On The Agenda?" />
      <button type="submit" id="addToDo">Add</button>
    </form>

    <!-- Empty UL List -->
    <ul id="todoList"></ul>

    <!-- P Tag for Error Messages -->
    <p id="toDoError" class="error-text"></p>

    <!-- Items left message P tag -->
    <p id="itemsLeft"></p>

    <script src="script.js"></script>
  </body>
</html>
